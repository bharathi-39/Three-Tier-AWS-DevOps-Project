services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bgcv_servicehub}
      POSTGRES_USER: ${POSTGRES_USER:-bgcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bgcv} -d ${POSTGRES_DB:-bgcv_servicehub}"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bgcv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bgcv_servicehub}
      CORS_ORIGINS: http://localhost:3000
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:8080"]
volumes: {postgres_data: {}}
