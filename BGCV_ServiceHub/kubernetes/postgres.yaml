apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: bgcv-servicehub}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: bgcv-servicehub}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{configMapRef: {name: bgcv-config}}, {secretRef: {name: bgcv-secrets}}]
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: bgcv-servicehub}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
